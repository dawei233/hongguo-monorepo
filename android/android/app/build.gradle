plugins {
    id 'com.android.application'
}

// 签名与版本号由 CI 注入（保证所有版本签名一致，可覆盖升级）
def ksFile = System.getenv("KEYSTORE_FILE")
def ksStorePass = System.getenv("KEYSTORE_PASSWORD") ?: ""
def ksAlias = System.getenv("KEY_ALIAS") ?: ""
def ksKeyPass = System.getenv("KEY_PASSWORD") ?: ""
def buildNumber = (System.getenv("VERSION_CODE") ?: "1").toInteger()

android {
    namespace 'com.hongguo.manju'
    compileSdk 34

    defaultConfig {
        applicationId "com.hongguo.manju"
        minSdk 24
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        release {
            if (ksFile) {
                storeFile file(ksFile)
                storePassword ksStorePass
                keyAlias ksAlias
                keyPassword ksKeyPass
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            if (ksFile) signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            if (ksFile) {
                signingConfig signingConfigs.release
            } else {
                // CI 没注入正式 keystore 时回退到 Android 默认 debug.keystore,
                // 保证 app-release.apk 也是已签名可装(系统提示来源未签名但能正常使用)
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        exclude 'META-INF/NOTICE.md'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.9.0'
    // 已切换到 Android 系统 VideoView (MediaPlayer + 系统硬解)
    // ExoPlayer 对部分 HEVC 容器严格 demuxer 兼容有问题（ERROR_CODE_PARSING_CONTAINER_MALFORMED）
    // 系统 MediaPlayer 在骁龙870 + Android 13 上对 HEVC 硬解最稳
}
