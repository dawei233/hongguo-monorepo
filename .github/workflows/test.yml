name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装 NAS 后端依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r nas-backend/requirements.txt -r nas-backend/liushen/requirements.txt
          pip install pytest
      - name: 跑冒烟测试
        working-directory: nas-backend
        run: pytest tests/ -v
      - name: 校验共用文件已同步
        run: python scripts/sync_core.py --check
